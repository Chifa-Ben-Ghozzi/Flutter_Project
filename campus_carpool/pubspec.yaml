name: campus_carpool
description: Campus Carpooling App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.0
  image_picker: ^1.0.7
  url_launcher: ^6.3.3
  flutter_local_notifications: ^22.3.2
  provider: ^6.1.5+1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.0.0
  firebase_messaging: ^17.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^6.0.0
  fake_cloud_firestore: ^4.4.0
  cloud_firestore_platform_interface: ">=8.0.7 <8.1.0"

flutter:
  uses-material-design: true
  # Police de l'app : Plus Jakarta Sans (licence libre SIL OFL, voir assets/fonts/OFL.txt)
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800

# App icon: regenerate with `dart run flutter_launcher_icons`
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: "ic_launcher"
  adaptive_icon_background: "#3F51B5"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    background_color: "#3F51B5"
    theme_color: "#3F51B5"
